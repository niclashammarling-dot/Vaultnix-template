name: Weekly Vault Lint

on:
  schedule:
    - cron: "23 8 * * 1"   # Monday 08:23 UTC — override in vault.config.yaml
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Braindex
        run: pip install braindex

      - name: Validate wiki
        run: braindex validate wiki/
        continue-on-error: true

      - name: Run LLM lint
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: braindex lint

      - name: Commit lint report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force lint/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "lint: $(date +%Y-%m-%d)"
          git push
