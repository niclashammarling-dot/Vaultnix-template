# ============================================================
# vault.config.yaml — Vault operating configuration
# Generated by setup wizard. Edit freely.
# All scripts, prompts, and automation derive from this file.
# ============================================================

# ------------------------------------
# Identity
# ------------------------------------
vault:
  name: "My Vault"           # used in prompts and commit messages
  owner: "Your Name"         # used in agent prompts ("owner provides raw sources")
  path: "/path/to/your/vault"  # absolute path to vault root

# ------------------------------------
# Domains
# Two structural domains are always present: knowledge-work, inspiration.
# Add your own below. Each gets: raw/, wiki/, outputs/ subdirectories,
# a seed MOC stub, and a slot in COMPILATION_PROMPT context.
# ------------------------------------
domains:
  - name: "domain-one"
    description: >
      One paragraph describing this domain at domain-expert density.
      This is injected into the compiler prompt so the agent understands
      the vocabulary, tools, and design philosophy of your work here.

  - name: "domain-two"
    description: >
      One paragraph describing this domain.

# Add more domains as needed. knowledge-work and inspiration are
# always included automatically — do not list them here.

# ------------------------------------
# LLM configuration
# Primary is used for lint and compilation. Fallback is optional.
# api_key_env: name of the environment variable containing the API key.
# Supported providers: openai, xai, anthropic
# ------------------------------------
llm:
  primary:
    provider: "openai"             # openai | xai | anthropic
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"

  fallback:                        # optional — remove if not needed
    provider: "xai"
    model: "grok-3"
    api_key_env: "XAI_API_KEY"

# Local .env file to load keys from (optional).
# Path is relative to vault root. Leave blank to use shell environment only.
env_file: ""                       # e.g. ".env"

# ------------------------------------
# Lint schedule
# ------------------------------------
lint:
  schedule: "23 8 * * 1"          # cron expression (UTC) — default: Monday 08:23
  platform: "github-actions"       # github-actions | local-cron | manual

# ------------------------------------
# Git and automation
# ------------------------------------
git:
  remote: "github"                 # github | gitlab | local
  repo: "your-username/your-repo"  # owner/repo for write-back workflows

compile:
  mode: "manual"                   # manual | scheduled
  # If scheduled, set a cron expression:
  # trigger: "0 22 * * *"
